[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f680"
version = "1.0.0"
description = "Python client for the ZTE F680 (DST/MGTS) admin web API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "pycryptodome>=3.15",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[project.scripts]
f680-api = "f680.cli.api:main"
f680-pf = "f680.cli.pf:main"
f680-net = "f680.cli.net:main"
f680-dhcp = "f680.cli.dhcp:main"

[tool.setuptools.packages.find]
include = ["f680*"]
